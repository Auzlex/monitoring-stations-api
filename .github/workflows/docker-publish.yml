name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate CI secrets
        run: |
          echo "CI_DB_PASSWORD=$(openssl rand -hex 16)" >> $GITHUB_ENV
          echo "CI_JWT_SECRET=$(openssl rand -hex 32)" >> $GITHUB_ENV

      - name: Start PostgreSQL container
        run: |
          docker run -d \
            --name postgres \
            -p 5439:5439 \
            -e POSTGRES_USER=test_user_ci \
            -e POSTGRES_PASSWORD=${{ env.CI_DB_PASSWORD }} \
            -e POSTGRES_DB=monitoring_test_db \
            -e PGPORT=5439 \
            postgres:15-alpine
          
          # Wait for PostgreSQL to be ready
          echo "Waiting for PostgreSQL to be ready..."
          until docker exec postgres pg_isready -p 5439; do
            sleep 1
          done

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma db push
        env:
          DATABASE_URL: postgresql://test_user_ci:${{ env.CI_DB_PASSWORD }}@localhost:5439/monitoring_test_db?schema=public

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test_user_ci:${{ env.CI_DB_PASSWORD }}@localhost:5439/monitoring_test_db?schema=public
          ENDPOINT_ADMIN_ACCESS_EMAIL: admin_ci_test@example.com
          ENDPOINT_ADMIN_ACCESS_PASSWORD: admin_ci_test
          JWT_SECRET: ${{ env.CI_JWT_SECRET }}

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: auzlex/monitoring-stations-api:latest,auzlex/monitoring-stations-api:${{ github.sha }}
          cache-from: type=registry,ref=auzlex/monitoring-stations-api:buildcache
          cache-to: type=registry,ref=auzlex/monitoring-stations-api:buildcache,mode=max
