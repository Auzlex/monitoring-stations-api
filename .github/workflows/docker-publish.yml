name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user_ci
          POSTGRES_PASSWORD: ci_test_password_123_456
          POSTGRES_DB: monitoring_test_db
          PGPORT: 5439
        ports:
          - 5439:5439
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Run database migrations
        run: pnpm exec prisma db push
        env:
          DATABASE_URL: postgresql://test_user_ci:ci_test_password_123_456@localhost:5439/monitoring_test_db?schema=public

      - name: Run Tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://test_user_ci:ci_test_password_123_456@localhost:5439/monitoring_test_db?schema=public
          ENDPOINT_ADMIN_ACCESS_EMAIL: admin_ci_test@example.com
          ENDPOINT_ADMIN_ACCESS_PASSWORD: admin_ci_test
          JWT_SECRET: ci_test_jwt_secret_998877665544332211

  build-and-push:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: auzlex/monitoring-stations-api:latest,auzlex/monitoring-stations-api:${{ github.sha }}
          cache-from: type=registry,ref=auzlex/monitoring-stations-api:buildcache
          cache-to: type=registry,ref=auzlex/monitoring-stations-api:buildcache,mode=max
