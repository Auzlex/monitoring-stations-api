name: CI - Test and Auto Merge

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

# Required so the auto-merge job can push to main
permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    # ← All env vars are defined once at job level → available to every step
    env:
      SKIP_ENV_FILE: true
      PORT: ${{ secrets.PORT }}
      MONGODB_PASSWORD: ${{ secrets.MONGODB_PASSWORD }}
      ENDPOINT_ADMIN_ACCESS_PASSWORD: ${{ secrets.ENDPOINT_ADMIN_ACCESS_PASSWORD }}
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Debug env (check this in the logs!)
        run: env

      - name: Install dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test   # ← no need to repeat env here

  auto-merge:
    needs: test
    runs-on: ubuntu-latest
    # Only run on push to dev, NOT on every PR to dev
    if: success() && github.event_name == 'push'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Merge dev → main
        uses: devmasx/merge-branch@v1.4.0
        with:
          type: now
          from_branch: dev
          target_branch: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}